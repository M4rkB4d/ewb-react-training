# azure-pipelines.yml
trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main

variables:
  nodeVersion: '24.x'
  azureSubscription: 'ewb-azure-service-connection'
  imageName: 'ewb-public-site'
  # Variable group 'ewb-nextjs-vars' contains:
  # AZURE_ACR_NAME, AZURE_APP_NAME, AZURE_RG

stages:
  - stage: QualityGates
    displayName: 'Quality Gates'
    jobs:
      - job: LintTypeCheckTest
        displayName: 'Lint, Type Check & Unit Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@1
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'
          - script: npm ci
            displayName: 'Install dependencies'
          - script: npm run lint
            displayName: 'Lint'
          - script: npm run type-check
            displayName: 'Type check'
          - script: npm run test:coverage
            displayName: 'Unit tests with coverage'
          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: coverage
              artifactName: coverage-report
            displayName: 'Publish coverage report'

      - job: E2ETests
        displayName: 'E2E Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@1
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'
          - script: npm ci
            displayName: 'Install dependencies'
          - script: npx playwright install --with-deps chromium
            displayName: 'Install Playwright'
          - script: npm run test:e2e
            displayName: 'Run E2E tests'
          - task: PublishBuildArtifacts@1
            condition: failed()
            inputs:
              pathToPublish: playwright-report
              artifactName: playwright-report
            displayName: 'Publish Playwright report (on failure)'

  - stage: BuildAndPush
    displayName: 'Build & Push Docker Image'
    dependsOn: QualityGates
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      - group: ewb-nextjs-vars
    jobs:
      - job: DockerBuild
        displayName: 'Build and Push to ACR'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'Build and push to Azure Container Registry'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr build \
                  --registry $(AZURE_ACR_NAME) \
                  --image $(imageName):$(Build.SourceVersion) \
                  --image $(imageName):latest \
                  .

  - stage: DeployStaging
    displayName: 'Deploy to Staging'
    dependsOn: BuildAndPush
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    variables:
      - group: ewb-nextjs-vars
    jobs:
      - deployment: DeployToStaging
        displayName: 'Deploy to Staging Slot'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'ewb-public-staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Deploy to staging slot'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az webapp config container set \
                        --name $(AZURE_APP_NAME) \
                        --resource-group $(AZURE_RG) \
                        --slot staging \
                        --container-image-name $(AZURE_ACR_NAME).azurecr.io/$(imageName):$(Build.SourceVersion)
                - task: AzureCLI@2
                  displayName: 'Wait for container to start'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az webapp deployment slot wait \
                        --name $(AZURE_APP_NAME) \
                        --resource-group $(AZURE_RG) \
                        --slot staging \
                        --created
                - script: |
                    STAGING_URL="https://$(AZURE_APP_NAME)-staging.azurewebsites.net"
                    STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/api/health")
                    if [ "$STATUS" != "200" ]; then
                      echo "Health check failed with status $STATUS"
                      exit 1
                    fi
                  displayName: 'Smoke test staging'

  - stage: DeployProduction
    displayName: 'Deploy to Production'
    dependsOn: BuildAndPush
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: ewb-nextjs-vars
    jobs:
      - deployment: DeployToProduction
        displayName: 'Deploy to Production (slot swap)'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'ewb-public-production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Deploy to staging slot'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az webapp config container set \
                        --name $(AZURE_APP_NAME) \
                        --resource-group $(AZURE_RG) \
                        --slot staging \
                        --container-image-name $(AZURE_ACR_NAME).azurecr.io/$(imageName):$(Build.SourceVersion)
                - task: AzureCLI@2
                  displayName: 'Wait for container to start'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az webapp deployment slot wait \
                        --name $(AZURE_APP_NAME) \
                        --resource-group $(AZURE_RG) \
                        --slot staging \
                        --created
                - script: |
                    STAGING_URL="https://$(AZURE_APP_NAME)-staging.azurewebsites.net"
                    STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/api/health")
                    if [ "$STATUS" != "200" ]; then
                      echo "Health check failed with status $STATUS"
                      exit 1
                    fi
                  displayName: 'Smoke test staging slot'
                - task: AzureCLI@2
                  displayName: 'Swap staging to production'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az webapp deployment slot swap \
                        --name $(AZURE_APP_NAME) \
                        --resource-group $(AZURE_RG) \
                        --slot staging \
                        --target-slot production
