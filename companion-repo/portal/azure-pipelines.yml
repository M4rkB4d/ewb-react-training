# azure-pipelines.yml
trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main

variables:
  nodeVersion: '24.x'
  azureSubscription: 'ewb-azure-service-connection'
  # Variable group 'ewb-portal-vars' contains:
  # AZURE_STORAGE_ACCOUNT_STAGING, AZURE_STORAGE_ACCOUNT_PROD,
  # AZURE_RG, AZURE_CDN_PROFILE, AZURE_CDN_ENDPOINT_STAGING,
  # AZURE_CDN_ENDPOINT_PROD

stages:
  - stage: QualityGates
    displayName: 'Quality Gates'
    jobs:
      - job: LintAndTypeCheck
        displayName: 'Lint & Type Check'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@1
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'
          - script: npm ci
            displayName: 'Install dependencies'
          - script: npm run lint
            displayName: 'Lint'
          - script: npm run type-check
            displayName: 'Type check'

      - job: UnitTests
        displayName: 'Unit Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@1
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'
          - script: npm ci
            displayName: 'Install dependencies'
          - script: npm run test:coverage
            displayName: 'Run unit tests with coverage'
          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: coverage
              artifactName: coverage-report
            displayName: 'Publish coverage report'

      - job: E2ETests
        displayName: 'E2E Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@1
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'
          - script: npm ci
            displayName: 'Install dependencies'
          - script: npx playwright install --with-deps chromium
            displayName: 'Install Playwright'
          - script: npm run test:e2e
            displayName: 'Run E2E tests'
          - task: PublishBuildArtifacts@1
            condition: failed()
            inputs:
              pathToPublish: playwright-report
              artifactName: playwright-report
            displayName: 'Publish Playwright report (on failure)'

  - stage: Build
    displayName: 'Build'
    dependsOn: QualityGates
    jobs:
      - job: BuildApp
        displayName: 'Build Application'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@1
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js'
          - script: npm ci
            displayName: 'Install dependencies'
          - script: npm run build
            displayName: 'Build production bundle'
          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: dist
              artifactName: dist
            displayName: 'Publish build artifacts'

  - stage: DeployStaging
    displayName: 'Deploy to Staging'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    variables:
      - group: ewb-portal-vars
    jobs:
      - deployment: DeployToStaging
        displayName: 'Deploy to Staging'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'ewb-portal-staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Upload to Azure Blob Storage'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az storage blob upload-batch \
                        --account-name $(AZURE_STORAGE_ACCOUNT_STAGING) \
                        --destination '$web' \
                        --source $(Pipeline.Workspace)/dist \
                        --overwrite
                - task: AzureCLI@2
                  displayName: 'Purge Azure CDN cache'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az cdn endpoint purge \
                        --resource-group $(AZURE_RG) \
                        --profile-name $(AZURE_CDN_PROFILE) \
                        --name $(AZURE_CDN_ENDPOINT_STAGING) \
                        --content-paths '/*'

  - stage: DeployProduction
    displayName: 'Deploy to Production'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: ewb-portal-vars
    jobs:
      - deployment: DeployToProduction
        displayName: 'Deploy to Production'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'ewb-portal-production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Upload to Azure Blob Storage'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az storage blob upload-batch \
                        --account-name $(AZURE_STORAGE_ACCOUNT_PROD) \
                        --destination '$web' \
                        --source $(Pipeline.Workspace)/dist \
                        --overwrite
                - task: AzureCLI@2
                  displayName: 'Purge Azure CDN cache'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az cdn endpoint purge \
                        --resource-group $(AZURE_RG) \
                        --profile-name $(AZURE_CDN_PROFILE) \
                        --name $(AZURE_CDN_ENDPOINT_PROD) \
                        --content-paths '/*'
